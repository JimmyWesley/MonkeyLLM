# The suite must stay green (CLAUDE.md). This is what the `main` ruleset's
# required status check points at: without a check to require, "require status
# checks to pass" is a rule with nothing in it.
#
# No GPU and no network: the suite drives scripted models and a deterministic
# HashEmbedder stands in for the embedder, so a runner is enough.
name: tests

on:
  # `main` only. A commit on `develop` is a commit on a pull request's head —
  # the ruleset requires one — so listing `develop` here ran the whole suite
  # twice for the same SHA, once per event, on a two-version matrix: ~20
  # runner-minutes to learn one thing. The pull_request event is the one that
  # gates the merge, and a required check is matched by name against the head
  # SHA whichever event produced it. The trade named plainly: a push to
  # `develop` with no pull request open is no longer tested until one is.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # `release.yml` calls this same file instead of restating the suite. A
  # release that ran a *copy* of the checks would drift from the copy the
  # branches enforce, and the drift would surface as a published version
  # nobody can reproduce. One suite, two callers.
  workflow_call:

# Read-only by default. A public repo's workflow that needs no write should
# never be handed one.
permissions:
  contents: read

# One run per ref at a time: pushing three times in a row used to leave two
# full suites racing to answer a question nobody would read the answer to.
# Never for a tag — that run is the gate in front of an irreversible upload
# (`release.yml` calls this file), and a push landing meanwhile must not be
# able to cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; both claimed versions run.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Station serves the Studio's Vite build as static files (spec J.5)
      # and `apps/studio/dist` is gitignored, so without a build `GET /` is a
      # 404 and the test asserting the console is served fails on a missing
      # artifact rather than on anything the change did.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Build the Studio
        working-directory: apps/studio
        run: |
          npm ci
          npm run build

      # plant/graft commit inside the forest (spec C.7/C.8) and the fixture
      # builds its own embedded git, so the runner needs an identity or every
      # commit dies on "Please tell me who you are".
      - name: Give the runner a git identity
        run: |
          git config --global user.name  "monkeyllm-ci"
          git config --global user.email "ci@monkeyllm.invalid"
          git config --global init.defaultBranch main

      # Two packages, two licences (LICENSING.md): the engine from the root,
      # the host from apps/station. `ingest` carries the G.2 built-in readers
      # (openpyxl, python-docx, xlrd) that three test modules import, and the
      # suite drives the host, whose `httpx` is declared only in its own
      # pyproject — mcp 2.x ships `httpx2`, a different distribution under a
      # different import name — so installing the root alone leaves every
      # provider probe raising ModuleNotFoundError.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ingest]"
          python -m pip install -e apps/station

      - name: pytest
        run: python -m pytest -q

  # The `main` ruleset requires ONE context from this workflow, and it is this
  # job. A matrix job's check name carries its parameters ("tests (3.11)"), so
  # requiring the matrix directly couples the branch rules to the Python
  # versions: changing `python-version` renames the required checks, the
  # renamed ones never report, and every merge blocks with nothing on screen
  # to explain why. This name never changes, so the matrix stays free to.
  gate:
    needs: tests
    runs-on: ubuntu-latest
    # Without `always()` a failed matrix would *skip* this job, and a skipped
    # required check does not fail a pull request — the gate would wave
    # through exactly what it exists to stop.
    if: always()
    steps:
      - name: The matrix must have succeeded
        run: |
          # A matrix job's aggregate result is success only when every leg is.
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::tests: ${{ needs.tests.result }}"
            exit 1
          fi
          echo "tests: success"
