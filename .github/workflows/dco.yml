# A rule that lives only in CONTRIBUTING.md is a rule the pull request never
# reads. This is the mechanical half: no commit reaches `apps/` — or anywhere
# else — without a sign-off naming its own author.
#
# The sign-off certifies provenance; the inbound Apache-2.0 licence in
# CONTRIBUTING.md is what keeps the dual licensing (LICENSING.md) possible.
# This check is the audit trail for both: it is what makes an external commit
# identifiable years later, when the question is who agreed to what.
name: dco

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      # The default PR checkout is a synthetic merge commit with no history,
      # so the range below would be empty. Full depth, real head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # --no-merges: a merge commit carries no authored change to certify.
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%B' "$sha" \
                 | grep -qiF "Signed-off-by: $author"; then
              continue
            fi
            subject="$(git log -1 --format='%s' "$sha")"
            echo "::error::${sha:0:8} \"$subject\" has no Signed-off-by matching $author"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add it and push again:"
            echo "  git commit --amend -s        # the last commit"
            echo "  git rebase --signoff main    # the whole branch"
            echo "  git push --force-with-lease"
            echo ""
            echo "See CONTRIBUTING.md for what the sign-off certifies."
            exit 1
          fi

          echo "All commits signed off."
