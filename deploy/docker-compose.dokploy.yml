# MonkeyLLM on Dokploy — see deploy/README.md for the walkthrough.
#
# Dokploy service type: Compose. Compose Path: ./deploy/docker-compose.dokploy.yml
# Set the variables in Dokploy's Environment tab; add the domain in the
# Domains tab pointing at service `station`, container port 8800 (that is
# why there is no `ports:` here — Traefik reaches it over dokploy-network).
#
# First deploy mints a bootstrap `admin` API key and prints it ONCE in the
# deployment logs — store it; only its digest is kept.

services:
  station:
    build:
      context: ..
      dockerfile: apps/station/Dockerfile
    # --writable accepts plant/graft/tend, ingest and forest creation.
    # Remove the flag for a read-only Station (reads always work).
    command: ["station", "serve", "--host", "0.0.0.0", "--port", "8800", "--writable"]
    expose:
      - "8800"
    networks:
      - dokploy-network
    environment:
      # Break-glass Studio login (J.2.1) — optional; without both there is
      # no password door, only API keys. Never stored, rotated by redeploy.
      MONKEYLLM_STATION_ADMIN: ${MONKEYLLM_STATION_ADMIN:-}
      MONKEYLLM_STATION_PASSWORD: ${MONKEYLLM_STATION_PASSWORD:-}
      # Hosts the MCP surface answers to. Set it to your Dokploy domain
      # (e.g. "monkeyllm.dev.example.com"); `*` skips the host check —
      # acceptable here because every request still carries an API key.
      MONKEYLLM_STATION_ALLOWED_HOSTS: ${MONKEYLLM_STATION_ALLOWED_HOSTS:-*}
      # Chat provider (J.10.1) — arrives pre-configured and read-only in
      # Studio -> Models, key never copied into the registry.
      MONKEYLLM_LLM_ENDPOINT: ${MONKEYLLM_LLM_ENDPOINT:-}
      MONKEYLLM_LLM_API_KEY: ${MONKEYLLM_LLM_API_KEY:-}
      MONKEYLLM_LLM_PROVIDER: ${MONKEYLLM_LLM_PROVIDER:-}
      MONKEYLLM_LLM_MODEL: ${MONKEYLLM_LLM_MODEL:-local}
      MONKEYLLM_LLM_MAX_TOKENS: ${MONKEYLLM_LLM_MAX_TOKENS:-300}
      MONKEYLLM_LLM_REASONING: ${MONKEYLLM_LLM_REASONING:-off}
      # Embedder (optional Canopy vector layer; unset = BM25-only contract).
      MONKEYLLM_EMBED_ENDPOINT: ${MONKEYLLM_EMBED_ENDPOINT:-}
      MONKEYLLM_EMBED_MODEL: ${MONKEYLLM_EMBED_MODEL:-bge-m3}
      MONKEYLLM_EMBED_API_KEY: ${MONKEYLLM_EMBED_API_KEY:-no-key}
      MONKEYLLM_EMBED_PROVIDER: ${MONKEYLLM_EMBED_PROVIDER:-}
      # S3-compatible endpoint for remote payloads (MinIO/R2, spec G.9).
      MONKEYLLM_S3_ENDPOINT: ${MONKEYLLM_S3_ENDPOINT:-}
    volumes:
      # Forests: markdown, embedded git history, dataset .db payloads,
      # _derived/ caches. Named volumes survive every redeploy and rebuild.
      - forests:/forests
      # Host registry: principals, keys, grants, audit — one SQLite file.
      - registry:/registry
      # Model weights (GGUFs) for the optional local inference services
      # below; multi-GB files stay out of the image and alive across updates.
      - models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/v1/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # -- Optional: local chat LLM (llama.cpp), profile `local-llm` -----------
  # If your Dokploy version cannot pass `--profile`, delete the `profiles:`
  # line to always run it. First start downloads the GGUF into the models
  # volume; then set MONKEYLLM_LLM_ENDPOINT=http://llm:8090/v1 above.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["local-llm"]
    environment:
      LLAMA_CACHE: /models
    command: >
      -hf ${LLAMA_CHAT_HF:-bartowski/Qwen2.5-7B-Instruct-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8090 -c ${LLAMA_CTX:-8192}
    volumes:
      - models:/models
    networks:
      - dokploy-network
    restart: unless-stopped

  # -- Optional: local embedder (Canopy), profile `local-embed` ------------
  # Then set MONKEYLLM_EMBED_ENDPOINT=http://embed:8091/v1 above.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["local-embed"]
    environment:
      LLAMA_CACHE: /models
    command: >
      -hf ${LLAMA_EMBED_HF:-gpustack/bge-m3-GGUF:Q8_0}
      --embeddings --host 0.0.0.0 --port 8091
    volumes:
      - models:/models
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  forests:
  registry:
  models:

networks:
  dokploy-network:
    external: true
