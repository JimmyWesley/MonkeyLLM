[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeyllm"
version = "0.79.0"
description = "A knowledge engine for AI agents: your documents become a git-versioned markdown knowledge graph an agent navigates over MCP, instead of flat vector search."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "llm", "rag", "retrieval-augmented-generation", "agentic-rag",
    "ai-agents", "agent-memory", "ai-memory", "context-engineering",
    "mcp", "mcp-server", "model-context-protocol", "claude-code",
    "knowledge-graph", "knowledge-base", "graphrag", "markdown",
    "sqlite", "local-first", "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # mcp 2.0 renamed FastMCP to mcp.server.mcpserver.MCPServer; the engine
    # targets the 2.x line (1.x lacks the import path).
    "mcp>=2,<3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
demo = ["huggingface_hub>=0.30"]
# G.2 built-in converters that need a (MIT/BSD-clean) third-party reader
ingest = ["openpyxl>=3.1", "python-docx>=1.1", "xlrd>=2.0"]
# Part K dense layer. The scan is a matmul where numpy is present and a
# Python loop where it is not: 67.7 ms -> 0.11 ms on a 1,877-node index.
# Floor is 1.26, the first release with a Python 3.12 wheel (the engine
# takes >=3.11) — and a version actually exercised: 1.26.4, 2.0.2, 2.5.2.
canopy = ["numpy>=1.26"]

[project.urls]
Homepage      = "https://monkeyllm.com"
Repository    = "https://github.com/JimmyWesley/MonkeyLLM"
Documentation = "https://github.com/JimmyWesley/MonkeyLLM/blob/main/docs/guide/README.md"
Paper         = "https://github.com/JimmyWesley/MonkeyLLM/blob/main/paper/monkeyllm-paper.md"
Issues        = "https://github.com/JimmyWesley/MonkeyLLM/issues"

[project.scripts]
vine = "monkeyllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
