[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeyllm"
version = "0.1.0"
description = "MonkeyLLM - agent-navigable knowledge forest. Vine MCP server (Phase 0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp; the engine targets the 1.x line.
    "mcp>=1.2,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
demo = ["huggingface_hub>=0.30"]
# G.2 built-in converters that need a (MIT/BSD-clean) third-party reader
ingest = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
vine = "monkeyllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
