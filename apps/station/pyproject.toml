[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeyllm-station"
version = "0.1.0"
description = "MonkeyLLM Station — self-hostable host layer for forests (spec Part J)"
requires-python = ">=3.11"
# starlette and uvicorn already ship with `mcp`, so the host adds no new
# runtime dependency (spec J.6: one image, no external database).
dependencies = [
    "monkeyllm",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
station = "monkeyllm_station.cli:main"

[tool.setuptools.packages.find]
include = ["monkeyllm_station*"]
