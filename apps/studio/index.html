<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonkeyLLM Studio</title>
    <meta name="description" content="Console for a governed MonkeyLLM forest." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f7d58' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2.5L6.5 11h3L5 17.5h14L14.5 11h3z'/%3E%3Cpath d='M12 17.5v4'/%3E%3C/svg%3E" />
    <script>
      /* Theme before first paint: React mounting is one frame too late, and
         that frame is a white flash for anyone who chose dark. */
      (function () {
        try {
          var saved = localStorage.getItem('monkeyllm.studio.theme') || 'system'
          var dark = saved === 'dark' || (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) { /* private mode: the default in the attribute stands */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
